name: wagering

# Three independent instances of the service (app-1..3, ports 8081-8083) share
# PostgreSQL, SQS (LocalStack) and Keycloak. Each instance has its own process,
# memory and connection pool.

x-app: &app
  image: wallet-service:local
  restart: unless-stopped
  environment: &app-env
    DATABASE_URL: postgres://wallet_app:${WALLET_APP_PASSWORD:-wallet_app_local}@postgres:5432/${POSTGRES_DB:-wagering}?sslmode=disable
    DATABASE_MAX_CONNS: ${DATABASE_MAX_CONNS:-20}
    AWS_REGION: ${AWS_REGION:-us-east-1}
    SQS_ENDPOINT: http://localstack:4566
    AWS_ACCESS_KEY_ID: ${SERVICE_AWS_ACCESS_KEY_ID:-wallet-service}
    AWS_SECRET_ACCESS_KEY: ${SERVICE_AWS_SECRET_ACCESS_KEY:-wallet-service-local-secret}
    SQS_WAGER_QUEUE: wager-transactions.fifo
    SQS_WAGER_DLQ: wager-transactions-dlq.fifo
    SQS_EVENTS_QUEUE: wallet-events.fifo
    OIDC_ISSUER_URL: http://keycloak:8080/realms/wagering
    OIDC_AUDIENCE: wagering-api
    LOG_LEVEL: ${LOG_LEVEL:-info}
    PENDING_BACKOFF_BASE: ${PENDING_BACKOFF_BASE:-2s}
    PENDING_MAX_ATTEMPTS: ${PENDING_MAX_ATTEMPTS:-10}
    PENDING_TTL: ${PENDING_TTL:-15m}
  depends_on:
    postgres: { condition: service_healthy }
    keycloak: { condition: service_healthy }
    migrate: { condition: service_completed_successfully }
    sqs-provision: { condition: service_completed_successfully }
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://localhost:8080/health/ready"]
    interval: 5s
    timeout: 3s
    retries: 20
  stop_grace_period: 30s

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wagering_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wagering_owner_local}
      POSTGRES_DB: ${POSTGRES_DB:-wagering}
      WALLET_APP_PASSWORD: ${WALLET_APP_PASSWORD:-wallet_app_local}
    command: ["postgres", "-c", "max_connections=300"]
    ports: ["${POSTGRES_HOST_PORT:-55432}:5432"]
    volumes:
      - ./deploy/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  localstack:
    image: localstack/localstack:4.4
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
    ports: ["${LOCALSTACK_HOST_PORT:-4566}:4566"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:4566/_localstack/health | grep -q '\"sqs\": \"\\(available\\|running\\)\"'"]
      interval: 3s
      timeout: 3s
      retries: 40

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Fixed issuer: tokens requested from the host (localhost:8180) or from
      # the Docker network carry the same `iss`.
      KC_HOSTNAME: http://keycloak:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_PORT: "8080"
      KC_HEALTH_ENABLED: "true"
    ports: ["${KEYCLOAK_HOST_PORT:-8180}:8080"]
    volumes:
      - ./deploy/keycloak/wagering-realm.json:/opt/keycloak/data/import/wagering-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 40

  migrate:
    image: wallet-service:local
    build: .
    entrypoint: ["/app/migrate", "up"]
    environment:
      MIGRATIONS_DATABASE_URL: postgres://${POSTGRES_USER:-wagering_owner}:${POSTGRES_PASSWORD:-wagering_owner_local}@postgres:5432/${POSTGRES_DB:-wagering}?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  sqs-provision:
    image: wallet-service:local
    entrypoint: ["/app/sqs-provision"]
    environment:
      AWS_REGION: ${AWS_REGION:-us-east-1}
      SQS_ENDPOINT: http://localstack:4566
      AWS_ACCESS_KEY_ID: ${ADMIN_AWS_ACCESS_KEY_ID:-provisioner}
      AWS_SECRET_ACCESS_KEY: ${ADMIN_AWS_SECRET_ACCESS_KEY:-provisioner-local-secret}
      SQS_MAX_RECEIVE_COUNT: ${SQS_MAX_RECEIVE_COUNT:-5}
      SQS_VISIBILITY_TIMEOUT: 30s
    depends_on:
      localstack: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    restart: "no"

  app-1:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app-1
    ports: ["8081:8080"]

  app-2:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app-2
    ports: ["8082:8080"]

  app-3:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app-3
    ports: ["8083:8080"]

  # Test runner with a C toolchain (needed by -race), inside the compose
  # network. Usage: docker compose --profile test run --rm tests
  # (default: go test -race -tags integration ./...)
  tests:
    image: golang:1.27.2
    profiles: ["test"]
    working_dir: /src
    entrypoint: ["go", "test"]
    command: ["-race", "-tags", "integration", "-count=1", "-timeout", "20m", "./..."]
    environment:
      CGO_ENABLED: "1"
      GOFLAGS: -buildvcs=false
      IT_PG_ADMIN_URL: postgres://${POSTGRES_USER:-wagering_owner}:${POSTGRES_PASSWORD:-wagering_owner_local}@postgres:5432/${POSTGRES_DB:-wagering}?sslmode=disable
      IT_PG_APP_PASSWORD: ${WALLET_APP_PASSWORD:-wallet_app_local}
      IT_KEYCLOAK_URL: http://keycloak:8080
      IT_SQS_ENDPOINT: http://localstack:4566
    volumes:
      - .:/src
      - gomodcache:/go/pkg/mod
      - gobuildcache:/root/.cache/go-build
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      localstack: { condition: service_healthy }

volumes:
  pgdata:
  gomodcache:
  gobuildcache:
